name: HomeRadar daily update

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: smoke imports one company; daily reserves up to 40 companies
        type: choice
        options: [smoke, daily]
        default: smoke

permissions:
  contents: read
concurrency:
  group: homeradar-live
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install Chromium and SSH client
        run: |
          python -m pip install .
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
      - name: Collect sequentially and import through private SSH bridge
        env:
          HOMERADAR_SSH_PASSWORD: ${{ secrets.HOMERADAR_SSH_PASSWORD }}
          HOMERADAR_SSH_KNOWN_HOSTS: ${{ secrets.HOMERADAR_SSH_KNOWN_HOSTS }}
          HR_MODE: ${{ inputs.mode || 'daily' }}
        run: |
          cat > /tmp/homeradar_actions.py <<'PYTHON'
          import json,os,re,subprocess,sys,time,shlex,hashlib
          from pathlib import Path
          host='u3523819@37.140.192.181'
          opts=['-o','ConnectTimeout=15','-o','StrictHostKeyChecking=yes','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2']
          env=dict(os.environ,SSHPASS=os.environ['HOMERADAR_SSH_PASSWORD'])
          sshdir=Path.home()/'.ssh';sshdir.mkdir(mode=0o700,exist_ok=True)
          (sshdir/'known_hosts').write_text(os.environ['HOMERADAR_SSH_KNOWN_HOSTS'])
          def remote(command):
           r=subprocess.run(['sshpass','-e','ssh',*opts,host,command],env=env,capture_output=True,text=True,timeout=90)
           if r.returncode:raise RuntimeError('ssh_bridge_failed_'+str(r.returncode))
           return r.stdout
          limit=1 if os.environ.get('HR_MODE','smoke')=='smoke' else 40
          batch=json.loads(remote('timeout 60 php ~/.homeradar-parser/actions-bridge.php reserve '+str(limit)))
          print(json.dumps({'reserved':len(batch['jobs']),'daily_attempts':batch['daily_attempts'],'daily_cap':40}),flush=True)
          summary=[];failed=False
          try:
           for job in batch['jobs']:
            oid=str(job['org']);pid=int(job['id'])
            if not re.fullmatch(r'\d+',oid) or pid==408 or oid=='79619695705':raise RuntimeError('job_mapping_rejected')
            folder=Path('review_results')/('bridge-'+os.environ['GITHUB_RUN_ID'])/oid;folder.mkdir(parents=True)
            output=folder/(oid+'.json')
            with (folder/'private.log').open('w') as log:
             r=subprocess.run(['timeout','--kill-after=15','360','python','export_homeradar.py',oid,'--output',str(output)],stdout=log,stderr=subprocess.STDOUT,timeout=390)
            if r.returncode or not output.is_file():
             text=(folder/'private.log').read_text(errors='replace'); reasons=re.findall(r'\[([a-z][a-z0-9_]+)\]',text)
             summary.append({'id':pid,'org':oid,'status':'export_failed','reason':reasons[-1] if reasons else 'exit_'+str(r.returncode)})
             remote('timeout 30 php ~/.homeradar-parser/bridge.php error '+str(pid)+' actions_export_failed')
             failed=True;break
            rows=json.loads(output.read_text())
            if not isinstance(rows,list) or not rows:raise RuntimeError('empty_export')
            digest=hashlib.sha256(output.read_bytes()).hexdigest()
            filename='actions-'+os.environ['GITHUB_RUN_ID']+'-'+oid+'.json'
            r=subprocess.run(['sshpass','-e','scp',*opts,str(output),host+':.homeradar-parser/exports/'+filename],env=env,capture_output=True,timeout=60)
            if r.returncode:raise RuntimeError('scp_failed')
            result=json.loads(remote('timeout 60 php ~/.homeradar-parser/bridge.php import '+str(pid)+' '+oid+' ~/.homeradar-parser/exports/'+filename))
            status=json.loads(remote('timeout 30 php ~/.homeradar-parser/actions-bridge.php status '+str(pid)))
            if float(status['rating'])!=float(rows[0]['businessRating']) or int(status['count'])!=rows[0]['businessRatingsCount'] or status['stored_count']!=min(30,len(rows)):raise RuntimeError('wp_readback_mismatch')
            summary.append({'id':pid,'org':oid,'status':'imported','rating':status['rating'],'count':status['count'],'stored_count':status['stored_count'],'exported_reviews':len(rows),'sha256':digest,'url':status['url'],'wp_success':status['success']})
            print(json.dumps(summary[-1]),flush=True)
            remote('rm -f ~/.homeradar-parser/exports/'+filename)
            if len(batch['jobs'])>1:time.sleep(20)
          finally:
           safe={'jobs':summary,'reserved':len(batch['jobs']),'daily_attempts':batch['daily_attempts'],'daily_cap':40}
           Path('actions-bridge-summary.json').write_text(json.dumps(safe,ensure_ascii=False,indent=2))
           with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('```json\n'+json.dumps(safe,ensure_ascii=False,indent=2)+'\n```\n')
          if failed:sys.exit(1)
          PYTHON
          python /tmp/homeradar_actions.py
      - name: Preserve safe summary only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: homeradar-ssh-summary
          path: actions-bridge-summary.json
          if-no-files-found: warn
          retention-days: 3

name: HomeRadar manual smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homeradar-manual-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and Chromium
        run: |
          python -m pip install .
          python -m playwright install --with-deps chromium
      - name: Runner resources
        run: |
          nproc
          free -h
          df -h .
      - name: Offline regression tests
        run: python -m unittest discover -v
      - name: Live smoke test on ten organizations
        timeout-minutes: 10
        run: python actions_smoke.py
      - name: Upload summary only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homeradar-smoke-summary
          path: |
            review_results/actions-smoke/summary.json
            review_results/actions-smoke/summary.md
          if-no-files-found: warn
          retention-days: 3

name: HomeRadar manual smoke test

on:
  workflow_dispatch:
    inputs:
      scope:
        description: One-off test scope (no site updates)
        type: choice
        default: smoke
        options:
          - smoke
          - dom-v-srok
          - catalog
          - selected
          - daily
      organization_ids:
        description: Space-separated Yandex IDs for selected scope
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: homeradar-live
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and Chromium
        run: |
          python -m pip install .
          python -m playwright install --with-deps chromium
      - name: Runner resources
        run: |
          nproc
          free -h
          df -h .
      - name: Offline regression tests
        run: python -m unittest discover -v
      - name: Live acceptance test
        timeout-minutes: ${{ (inputs.scope == 'catalog' || inputs.scope == 'selected' || inputs.scope == 'daily') && 330 || 10 }}
        env:
          TEST_SCOPE: ${{ inputs.scope }}
          ORGANIZATION_IDS: ${{ inputs.organization_ids }}
        run: |
          if [ "$TEST_SCOPE" = "daily" ]; then
            if [[ "$ORGANIZATION_IDS" =~ [^0-9[:space:]] ]]; then
              echo "::error::organization_ids must contain numeric IDs"
              exit 2
            fi
            read -r -a ids <<< "${ORGANIZATION_IDS//[[:space:]]/ }"
            args=()
            if ((${#ids[@]})); then
              args+=(--organization "${ids[@]}")
            fi
            collection_code=0
            python run_homeradar.py collect --output review_results/daily "${args[@]}" || collection_code=$?
            python run_homeradar.py deliver --output review_results/daily --dry-run
            cat review_results/daily/summary.md >> "$GITHUB_STEP_SUMMARY"
            exit "$collection_code"
          elif [ "$TEST_SCOPE" = "catalog" ]; then
            python actions_catalog.py
          elif [ "$TEST_SCOPE" = "dom-v-srok" ]; then
            python actions_smoke.py --organization 243170996991
          elif [ "$TEST_SCOPE" = "selected" ]; then
            read -r -a ids <<< "$ORGANIZATION_IDS"
            python actions_smoke.py --organization "${ids[@]}"
          else
            python actions_smoke.py
          fi
      - name: Upload summary only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homeradar-smoke-summary
          path: |
            review_results/actions-smoke/summary.json
            review_results/actions-smoke/summary.md
            review_results/actions-catalog/catalog.json
            review_results/actions-catalog/results/summary.json
            review_results/actions-catalog/results/summary.md
            review_results/daily/catalog.json
            review_results/daily/collection/summary.json
            review_results/daily/collection/summary.md
            review_results/daily/delivery.json
            review_results/daily/summary.md
          if-no-files-found: warn
          retention-days: 3
